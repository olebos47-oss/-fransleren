<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Woordjes Leren</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --glass:       rgba(255,255,255,0.72);
    --glass2:      rgba(255,255,255,0.55);
    --glass3:      rgba(255,255,255,0.35);
    --border:      rgba(255,255,255,0.9);
    --border2:     rgba(0,0,0,0.08);
    --shadow:      0 8px 32px rgba(0,0,0,0.10), 0 1.5px 4px rgba(0,0,0,0.07);
    --shadow-lg:   0 20px 60px rgba(0,0,0,0.13), 0 4px 12px rgba(0,0,0,0.08);
    --blue:        #007AFF;
    --blue-lt:     rgba(0,122,255,0.12);
    --blue-md:     rgba(0,122,255,0.22);
    --green:       #34C759;
    --green-lt:    rgba(52,199,89,0.14);
    --red:         #FF3B30;
    --red-lt:      rgba(255,59,48,0.12);
    --yellow:      #FF9F0A;
    --text:        #1C1C1E;
    --text2:       #48484A;
    --text3:       #8E8E93;
    --text4:       #C7C7CC;
    --radius:      16px;
    --radius-sm:   10px;
    --radius-lg:   22px;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #e8edf5 0%, #dce6f0 30%, #e2dff5 60%, #d8eae0 100%);
    background-attachment: fixed;
    color: var(--text);
    overflow-x: hidden;
  }

  /* Decorative blobs */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(ellipse 700px 500px at 15% 20%, rgba(120,180,255,0.28) 0%, transparent 70%),
      radial-gradient(ellipse 500px 400px at 80% 70%, rgba(180,140,255,0.22) 0%, transparent 70%),
      radial-gradient(ellipse 400px 300px at 60% 10%, rgba(100,220,160,0.18) 0%, transparent 70%);
    pointer-events: none;
  }

  /* ── Glass mixin ── */
  .glass {
    background: var(--glass);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .glass2 {
    background: var(--glass2);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }

  /* ── Header ── */
  header {
    display: flex; align-items: center; justify-content: center;
    padding: 18px 24px;
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(30px) saturate(200%);
    -webkit-backdrop-filter: blur(30px) saturate(200%);
    border-bottom: 1px solid rgba(255,255,255,0.8);
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 1px 0 rgba(0,0,0,0.06), 0 4px 20px rgba(0,0,0,0.06);
  }
  .header-logo {
    font-size: 1.05rem; font-weight: 800; letter-spacing: -0.3px; color: var(--text);
    display: flex; align-items: center; gap: 8px;
  }
  .header-logo-icon {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, #007AFF, #5856D6);
    display: flex; align-items: center; justify-content: center;
  }
  .header-logo-icon svg { display: block; }
  .header-actions { position: absolute; right: 20px; display: flex; gap: 8px; }

  .icon-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.18s;
    color: var(--text2);
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .icon-btn:hover { background: rgba(255,255,255,0.85); transform: scale(1.05); }

  /* ── App shell ── */
  #app {
    max-width: 2600px; margin: 0 auto;
    padding: 28px 20px 60px;
    display: flex; flex-direction: column; gap: 14px;
  }

  /* ── Cards ── */
  .card {
    border-radius: var(--radius-lg);
    padding: 22px 24px;
  }
  .card-title {
    font-size: 0.68rem; font-weight: 700; color: var(--text3);
    letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 14px;
  }

  /* ── Drop zone ── */
  #dropZone {
    border: 2px dashed rgba(0,122,255,0.3);
    border-radius: var(--radius);
    padding: 32px 20px; text-align: center; cursor: pointer;
    background: rgba(0,122,255,0.04);
    transition: all 0.2s;
  }
  #dropZone:hover, #dropZone.drag {
    border-color: var(--blue); background: var(--blue-lt);
  }
  #dropZone p { font-size: 0.9rem; font-weight: 500; color: var(--text3); }
  #dropZone strong { color: var(--blue); font-weight: 700; }
  #fileInput { display: none; }
  #fileName {
    margin-top: 10px; font-size: 0.82rem; font-weight: 600;
    color: var(--blue); min-height: 1.2em;
  }
  #loadingMsg {
    display: none; text-align: center; color: var(--blue);
    font-size: 0.82rem; font-weight: 600; padding: 8px;
  }
  #noWordsMsg {
    display: none; color: var(--red); font-size: 0.82rem;
    font-weight: 600; text-align: center; padding: 8px; margin-top: 6px;
  }

  /* ── Dict textarea ── */
  .dict-hint { font-size: 0.75rem; color: var(--text3); font-weight: 500; margin-bottom: 8px; }
  textarea {
    width: 100%; background: rgba(255,255,255,0.7);
    border: 1px solid rgba(0,0,0,0.1); border-radius: var(--radius-sm);
    color: var(--text); font-size: 0.9rem; font-family: 'Inter', sans-serif;
    font-weight: 400; padding: 12px 14px; resize: vertical; line-height: 1.8;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,122,255,0.12); }
  textarea::placeholder { color: var(--text4); }

  /* ── Saved profiles ── */
  #savedList { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .saved-item {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.9);
    border-radius: var(--radius-sm); padding: 11px 14px;
    cursor: pointer; transition: all 0.18s;
  }
  .saved-item:hover { background: rgba(0,122,255,0.07); border-color: rgba(0,122,255,0.2); }
  .saved-icon { font-size: 1rem; flex-shrink: 0; }
  .saved-item-name { flex: 1; font-size: 0.88rem; font-weight: 600; color: var(--text); }
  .saved-item-meta { font-size: 0.72rem; color: var(--text3); font-weight: 500; }
  .saved-del {
    background: transparent; border: none; color: var(--text4);
    cursor: pointer; font-size: 0.85rem; padding: 3px 6px; border-radius: 6px;
    transition: all 0.15s; line-height: 1;
  }
  .saved-del:hover { color: var(--red); background: var(--red-lt); }
  .saved-empty { font-size: 0.82rem; color: var(--text3); font-weight: 500; text-align: center; padding: 10px 0; }

  .save-row { display: flex; gap: 8px; }
  #saveNameInput {
    flex: 1; background: rgba(255,255,255,0.7); border: 1px solid rgba(0,0,0,0.1);
    border-radius: var(--radius-sm); color: var(--text); font-family: 'Inter', sans-serif;
    font-size: 0.88rem; font-weight: 500; padding: 10px 13px; outline: none; transition: all 0.2s;
  }
  #saveNameInput:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,122,255,0.12); }
  #saveNameInput::placeholder { color: var(--text4); }
  #saveBtn {
    background: var(--blue); color: #fff; border: none;
    border-radius: var(--radius-sm); font-family: 'Inter', sans-serif;
    font-size: 0.82rem; font-weight: 700; padding: 10px 18px;
    cursor: pointer; white-space: nowrap; transition: all 0.18s;
  }
  #saveBtn:hover { background: #0066DD; transform: scale(1.02); }
  #saveFeedback { font-size: 0.75rem; font-weight: 600; color: var(--green); min-height: 1em; margin-top: 6px; opacity: 0; transition: opacity 0.3s; }
  #saveFeedback.show { opacity: 1; }

  /* ── Start button ── */
  #startBtn {
    width: 100%; padding: 16px;
    background: linear-gradient(135deg, #007AFF, #5856D6);
    color: #fff; border: none; border-radius: var(--radius);
    font-family: 'Inter', sans-serif; font-size: 1rem; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(0,122,255,0.3);
    letter-spacing: 0.2px;
  }
  #startBtn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,122,255,0.35); }
  #startBtn:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }

  /* ── LEARN SECTION ── */
  #learnSection { display: none; width: 100%; }

  /* New grid: sidebar | pdf | progress / answer panel full-width below */
  .learn-layout {
    display: grid;
    grid-template-columns: auto 1fr 56px;
    grid-template-rows: auto auto;
    gap: 14px;
    align-items: start;
  }

  /* Text sidebar (optional, left) */
  #textSidebar {
    grid-column: 1; grid-row: 1;
    width: 160px; flex-shrink: 0;
    border-radius: var(--radius-lg); padding: 16px 14px;
    position: sticky; top: 76px; display: none;
    align-self: flex-start;
  }
  #textSidebar .sidebar-title {
    font-size: 0.65rem; font-weight: 700; color: var(--text3);
    letter-spacing: 1px; text-transform: uppercase;
    margin-bottom: 10px; padding-bottom: 8px;
    border-bottom: 1px solid rgba(0,0,0,0.07);
  }
  .text-btn {
    display: block; width: 100%; text-align: left;
    background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.8);
    border-radius: 9px; color: var(--text2);
    font-family: 'Inter', sans-serif; font-size: 0.82rem; font-weight: 600;
    padding: 8px 11px; margin-bottom: 6px; cursor: pointer; transition: all 0.16s;
  }
  .text-btn:last-child { margin-bottom: 0; }
  .text-btn:hover { background: rgba(0,122,255,0.08); color: var(--blue); border-color: rgba(0,122,255,0.2); }
  .text-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); box-shadow: 0 3px 10px rgba(0,122,255,0.25); }
  .text-btn-all { border-style: dashed; border-color: rgba(0,0,0,0.13); }
  .text-btn-all.active { border-style: solid; }

  /* PDF viewer — fills available width in grid column 2 */
  #pdfViewer {
    grid-column: 2; grid-row: 1;
    border-radius: var(--radius-lg);
    position: relative;
    height: calc(100vh - 110px);
    width: 100%;
    box-shadow: var(--shadow-lg);
    background: #f5f0e8;
    overflow: hidden;
  }
  #pdfCanvas {
    position: absolute; top: 0; left: 0;
    display: block;
    transition: transform 0.55s cubic-bezier(0.25,0.46,0.45,0.94);
    transform-origin: 50% 50%;
  }

  /* Vertical progress sidebar — grid column 3, right of PDF */
  #progressSidebar {
    grid-column: 3; grid-row: 1;
    width: 56px; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center;
    gap: 0; position: sticky; top: 76px;
    align-self: flex-start;
  }

  /* Bottom row — spans all 3 columns */
  .learn-bottom {
    grid-column: 1 / -1; grid-row: 2;
    display: flex; flex-direction: column; gap: 10px;
  }

  /* Word counter */
  #wordCounter {
    text-align: right;
    font-size: 0.8rem; font-weight: 600; color: var(--text3);
  }
  #wordCounter span { color: var(--text2); font-weight: 700; }
  #progressTrack {
    width: 14px;
    height: calc(100vh - 230px);
    border-radius: 7px;
    background: rgba(0,0,0,0.08);
    position: relative; overflow: hidden;
    margin-bottom: 10px;
  }
  #progressFill {
    position: absolute; bottom: 0; left: 0; width: 100%;
    border-radius: 7px;
    background: linear-gradient(to top, var(--green), #30D158);
    transition: height 0.6s cubic-bezier(0.34,1.56,0.64,1);
    height: 0%;
  }
  .prog-stat {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    margin-bottom: 8px;
  }
  .prog-stat:last-child { margin-bottom: 0; }
  .prog-stat-icon { font-size: 1rem; line-height: 1; }
  .prog-stat-num { font-size: 0.82rem; font-weight: 800; }
  #statCorrect { color: var(--green); }
  #statWrong   { color: var(--red); }
  #highlight {
    position: absolute; border: 2.5px solid var(--blue); border-radius: 6px;
    background: rgba(0,122,255,0.12); box-shadow: 0 0 0 3000px rgba(0,0,0,0.42);
    pointer-events: none; opacity: 0;
    transition: opacity 0.4s ease, left 0.4s ease, top 0.4s ease, width 0.4s ease, height 0.4s ease;
  }
  #highlight.show { opacity: 1; }
  #pageInfo {
    position: absolute; top: 10px; right: 12px;
    font-size: 0.65rem; font-weight: 700; color: rgba(0,0,0,0.3);
    letter-spacing: 0.8px; text-transform: uppercase;
  }

  /* Answer panel */
  #answerPanel { border-radius: var(--radius-lg); padding: 20px 22px; }
  #wordPrompt { font-size: 1.9rem; font-weight: 800; color: var(--text); margin-bottom: 2px; letter-spacing: -0.5px; }
  #wordPromptSub { font-size: 0.72rem; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 16px; }
  .answer-row { display: flex; gap: 8px; }
  #answerInput {
    flex: 1; background: rgba(255,255,255,0.75); border: 1px solid rgba(0,0,0,0.1);
    border-radius: var(--radius-sm); color: var(--text); font-size: 1rem;
    font-family: 'Inter', sans-serif; font-weight: 500; padding: 12px 14px;
    outline: none; transition: all 0.2s;
  }
  #answerInput:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,122,255,0.12); }
  #answerInput:disabled { opacity: 0.5; }
  #checkBtn {
    background: var(--blue); color: #fff; border: none; border-radius: var(--radius-sm);
    font-family: 'Inter', sans-serif; font-size: 0.88rem; font-weight: 700;
    padding: 12px 22px; cursor: pointer; transition: all 0.18s; white-space: nowrap;
    box-shadow: 0 3px 10px rgba(0,122,255,0.25);
  }
  #checkBtn:hover { background: #0066DD; }
  #checkBtn:disabled { opacity: 0.4; cursor: default; box-shadow: none; }

  /* Feedback */
  #feedback {
    min-height: 50px; border-radius: var(--radius-sm); padding: 13px 16px;
    font-size: 0.92rem; font-weight: 600;
    display: flex; align-items: center; gap: 10px;
    opacity: 0; transition: opacity 0.22s;
  }
  #feedback.show { opacity: 1; }
  #feedback.correct { background: var(--green-lt); border: 1px solid rgba(52,199,89,0.3); color: #1a7a36; }
  #feedback.wrong   { background: var(--red-lt);   border: 1px solid rgba(255,59,48,0.25); color: #c0392b; }
  .fb-icon { font-size: 1rem; flex-shrink: 0; }

  /* Controls */
  #controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-start; }
  .ctrl-btn {
    border: 1px solid rgba(0,0,0,0.1); background: rgba(255,255,255,0.65);
    backdrop-filter: blur(10px); color: var(--text2);
    border-radius: var(--radius-sm); font-family: 'Inter', sans-serif; font-size: 0.8rem; font-weight: 600;
    padding: 9px 16px; cursor: pointer; transition: all 0.18s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .ctrl-btn:hover { border-color: rgba(0,0,0,0.18); background: rgba(255,255,255,0.85); }

  #nextBtn { display:none; background: rgba(52,199,89,0.12); border-color: rgba(52,199,89,0.3); color: #1a7a36; }
  #nextBtn:hover { background: rgba(52,199,89,0.2); }

  #tochGoedBtn { display:none; background: rgba(255,159,10,0.1); border-color: rgba(255,159,10,0.35); color: #8a5500; }
  #tochGoedBtn:hover { background: rgba(255,159,10,0.18); }
  .shortcut-hint {
    font-size: 0.65rem; opacity: 0.65; font-weight: 700;
    background: rgba(255,159,10,0.15); border-radius: 4px;
    padding: 1px 5px; margin-left: 5px; letter-spacing: 0.3px;
  }

  /* ── Correct flash overlay ── */
  #correctFlash {
    position: fixed; inset: 0; z-index: 999;
    background: rgba(52,199,89,0.18);
    backdrop-filter: blur(1px);
    pointer-events: none; opacity: 0;
    transition: opacity 0.08s ease;
  }
  #correctFlash.flash-in  { opacity: 1; }
  #correctFlash.flash-out { opacity: 0; transition: opacity 0.5s ease; }

  /* ── RESULT ── */
  #resultSection {
    display: none; text-align: center; padding: 44px 30px;
    border-radius: var(--radius-lg); width: 100%; max-width: 780px; margin: 0 auto;
  }
  #resultSection h2 { font-size: 1.6rem; font-weight: 800; color: var(--text); margin-bottom: 4px; }
  #resultScore { font-size: 4rem; font-weight: 900; color: var(--blue); margin: 10px 0; letter-spacing: -2px; }
  #resultMsg { color: var(--text2); font-weight: 500; margin-bottom: 20px; }
  #missedList { text-align: left; margin-top: 16px; }
  #missedList h3 { font-size: 0.65rem; font-weight: 700; color: var(--red); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; }
  #missedList li { list-style: none; font-size: 0.88rem; font-weight: 500; color: var(--text2); padding: 6px 0; border-bottom: 1px solid rgba(0,0,0,0.06); }
  #missedList li em { color: var(--blue); font-style: normal; font-weight: 700; }

  .result-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
  .result-btn {
    padding: 13px 26px; border: none; border-radius: var(--radius);
    font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
  }
  #playAgainBtn { background: linear-gradient(135deg,#007AFF,#5856D6); color: #fff; box-shadow: 0 4px 14px rgba(0,122,255,0.3); }
  #playAgainBtn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(0,122,255,0.35); }
  #retryMissedBtn { display:none; background: var(--red-lt); color: var(--red); border: 1px solid rgba(255,59,48,0.25); }
  #retryMissedBtn:hover { background: rgba(255,59,48,0.2); }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 2px; }
</style>
</head>
<body>

<!-- Green correct flash overlay -->
<div id="correctFlash"></div>

<header>
  <div class="header-logo">
    <div class="header-logo-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
    </div>
    PDF Woordjes Leren
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="fullscreenBtn" title="Volledig scherm">
      <svg id="fsIconEnter" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
        <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
      </svg>
      <svg id="fsIconExit" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/>
        <line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/>
      </svg>
    </button>
  </div>
</header>

<div id="app">

  <!-- SETUP -->
  <div id="setupSection" style="display:flex;flex-direction:column;gap:14px;">

    <div class="card glass">
      <div class="card-title">PDF uploaden</div>
      <input type="file" id="fileInput" accept=".pdf" style="display:none">
      <div id="dropZone">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#007AFF" stroke-width="1.5" style="opacity:0.5;margin-bottom:10px;display:block;margin-left:auto;margin-right:auto">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="18" x2="12" y2="12"/>
          <polyline points="9 15 12 12 15 15"/>
        </svg>
        <p>Sleep je PDF hierheen of <strong>klik om te selecteren</strong></p>
      </div>
      <div id="fileName"></div>
      <div id="loadingMsg">PDF wordt verwerkt…</div>
    </div>

    <div class="card glass">
      <div class="card-title">Woordenlijst</div>
      <div class="dict-hint">Één woord per regel &nbsp;·&nbsp; woord = betekenis</div>
      <textarea id="dictInput" rows="8" placeholder="gardiens = bewakers&#10;pelouse = grasveld&#10;grâce au = dankzij"></textarea>
      <div id="noWordsMsg">Geen woorden gevonden. Controleer de spelling.</div>

  <!-- LEARN -->
  <div id="learnSection">
    <div class="learn-layout">

      <!-- Text sidebar (left, hidden by default) -->
      <div id="textSidebar" class="glass2">

      <!-- PDF viewer -->
      <div id="pdfViewer">
        <canvas id="pdfCanvas"></canvas>
        <div id="highlight"></div>
        <div id="pageInfo"></div>
      </div>

      <!-- Vertical progress bar (right of PDF) -->
      <div id="progressSidebar">
        <div id="progressTrack">
          <div id="progressFill"></div>
        </div>
        <div class="prog-stat">
          <div class="prog-stat-icon" style="color:var(--green)">✓</div>
          <div class="prog-stat-num" id="statCorrect">0</div>

      <!-- Bottom row: answer panel + feedback + controls -->
      <div class="learn-bottom">

        <div id="wordCounter">Woord <span id="statCurrent">1</span> van <span id="statTotal">0</span></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ── State ────────────────────────────────────────────────────
let pdfDoc        = null;
let allEntries    = [];
let detectedTexts = [];
let activeFilter  = null;
let wordEntries   = [];
let queue         = [];
let qi            = 0;
let correctCnt    = 0;
let wrongCnt      = 0;
let missed        = [];
let answered      = false;
let lastWasWrong  = false;
let currentVP     = null;
let savedPdfName  = '';

const $ = id => document.getElementById(id);

// ── IndexedDB for large PDF storage ─────────────────────────
const DB_NAME = 'woordjesDB', DB_VERSION = 1, STORE = 'pdfs';
let db = null;

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => e.target.result.createObjectStore(STORE, { keyPath: 'name' });
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror   = e => rej(e.target.error);
  });
}
function dbPut(name, ab) {
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put({ name, data: ab });
    tx.oncomplete = () => res();
    tx.onerror    = e => rej(e.target.error);
  });
}
function dbGet(name) {
  return new Promise((res, rej) => {
    const tx  = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).get(name);
    req.onsuccess = () => res(req.result ? req.result.data : null);
    req.onerror   = e => rej(e.target.error);
  });
}
function dbDelete(name) {
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(name);
    tx.oncomplete = () => res();
    tx.onerror    = e => rej(e.target.error);
  });
}

// ── Saved profiles (localStorage meta + IndexedDB PDF data) ─
function getSaved() {
  try { return JSON.parse(localStorage.getItem('woordjes_saved') || '[]'); } catch(e) { return []; }
}
function setSaved(arr) { localStorage.setItem('woordjes_saved', JSON.stringify(arr)); }

function renderSavedList() {
  const list = getSaved();
  const el   = $('savedList');
  if (!list.length) { el.innerHTML = '<p class="saved-empty">Nog niets opgeslagen.</p>'; return; }
  el.innerHTML = '';
  list.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'saved-item';
    row.innerHTML = `
      <div class="saved-icon">📄</div>
      <div class="saved-item-name">${item.name}</div>
      <div class="saved-item-meta">${item.pdfName}</div>
      <button class="saved-del" data-idx="${idx}" title="Verwijderen">✕</button>`;
    row.addEventListener('click', e => { if (!e.target.classList.contains('saved-del')) loadSavedItem(item); });
    row.querySelector('.saved-del').addEventListener('click', e => { e.stopPropagation(); deleteSaved(idx, item.pdfName); });
    el.appendChild(row);
  });
}

async function loadSavedItem(item) {
  $('dictInput').value = item.dict;
  try {
    const ab = await dbGet(item.pdfName);
    if (!ab) { alert('PDF-bestand niet meer gevonden in opslag. Upload de PDF opnieuw.'); return; }
    savedPdfName = item.pdfName;
    $('fileName').textContent = '📄 ' + item.pdfName + ' (opgeslagen)';
    $('loadingMsg').style.display = 'block';
    $('startBtn').disabled = true;
    pdfDoc = await pdfjsLib.getDocument({ data: ab.slice(0) }).promise;
    $('loadingMsg').style.display = 'none';
    $('startBtn').disabled = false;
    showSaveFeedback('✓ "' + item.name + '" geladen!');
  } catch(e) {
    $('loadingMsg').style.display = 'none';
    $('startBtn').disabled = false;
    alert('Kon de PDF niet laden: ' + e.message);
  }
}

async function deleteSaved(idx, pdfName) {
  const list = getSaved();
  list.splice(idx, 1);
  // Only delete PDF from IndexedDB if no other profile uses it
  const stillUsed = list.some(i => i.pdfName === pdfName);
  if (!stillUsed) await dbDelete(pdfName).catch(()=>{});
  setSaved(list);
  renderSavedList();
}

function showSaveFeedback(msg) {
  const el = $('saveFeedback');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

$('saveBtn').addEventListener('click', async () => {
  const name = $('saveNameInput').value.trim();
  if (!name) { $('saveNameInput').focus(); return; }
  if (!pdfDoc) { alert('Upload eerst een PDF.'); return; }
  if (!savedPdfName) { alert('PDF nog niet geladen.'); return; }
  const dict = $('dictInput').value.trim();
  if (!dict) { alert('Vul eerst de woordenlijst in.'); return; }
  const list = getSaved();
  const existing = list.findIndex(i => i.name === name);
  const entry = { name, pdfName: savedPdfName, dict, savedAt: Date.now() };
  if (existing >= 0) list[existing] = entry; else list.unshift(entry);
  setSaved(list);
  renderSavedList();
  $('saveNameInput').value = '';
  showSaveFeedback('✓ Opgeslagen als "' + name + '"');
});

// ── Upload ───────────────────────────────────────────────────
const dropZone = $('dropZone');
dropZone.addEventListener('click', (e) => { e.stopPropagation(); $('fileInput').value = ''; $('fileInput').click(); });
dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag'); handleFile(e.dataTransfer.files[0]); });
$('fileInput').addEventListener('change', () => { if ($('fileInput').files[0]) handleFile($('fileInput').files[0]); });

async function handleFile(file) {
  if (!file || file.type !== 'application/pdf') { alert('Selecteer een PDF-bestand.'); return; }
  savedPdfName = file.name;
  $('fileName').textContent = '📄 ' + file.name;
  $('loadingMsg').style.display = 'block';
  $('startBtn').disabled = true;
  const ab = await file.arrayBuffer();
  // Store in IndexedDB (no size limit)
  await dbPut(file.name, ab).catch(e => console.warn('IndexedDB write failed:', e));
  pdfDoc = await pdfjsLib.getDocument({ data: ab.slice(0) }).promise;
  $('loadingMsg').style.display = 'none';
  $('startBtn').disabled = false;
}

// ── Parse dict ───────────────────────────────────────────────
function parseDict(raw) {
  const d = {};
  raw.split('\n').forEach(line => {
    const m = line.match(/^(.+?)\s*[=:]\s*(.+)$/);
    if (m) d[m[1].trim().toLowerCase()] = m[2].trim();
  });
  return d;
}

// ── Detect text sections ─────────────────────────────────────
async function detectTextSections() {
  const sections = [];
  const re = /^(tekst|text)\s*(\d+)/i;
  for (let p = 1; p <= pdfDoc.numPages; p++) {
    const page    = await pdfDoc.getPage(p);
    const content = await page.getTextContent();
    for (const item of content.items) {
      if (!item.str || !item.str.trim()) continue;
      const m = item.str.trim().match(re);
      if (m) { sections.push({ label: 'Tekst ' + m[2], number: parseInt(m[2]), startPage: p, endPage: pdfDoc.numPages }); break; }
    }
  }
  sections.sort((a,b) => a.startPage - b.startPage);
  for (let i = 0; i < sections.length - 1; i++) sections[i].endPage = sections[i+1].startPage - 1;
  return sections;
}

// ── Find words (prefer yellow highlight annotations) ─────────
async function findWords(dict, sections) {
  const words = Object.keys(dict);
  function sectionOf(page) {
    if (!sections.length) return null;
    for (const s of sections) { if (page >= s.startPage && page <= s.endPage) return s.label; }
    return null;
  }
  async function getHighlightRects(page) {
    let anns = [];
    try { anns = await page.getAnnotations(); } catch(e) { return []; }
    const rects = [];
    for (const ann of anns) {
      if (ann.subtype !== 'Highlight') continue;
      const c = ann.color;
      if (c && !(c[0] > 0.4 && c[1] > 0.4 && c[2] < 0.5)) continue;
      if (ann.quadPoints && ann.quadPoints.length) {
        for (let i = 0; i < ann.quadPoints.length; i += 8) {
          const xs = [ann.quadPoints[i],ann.quadPoints[i+2],ann.quadPoints[i+4],ann.quadPoints[i+6]];
          const ys = [ann.quadPoints[i+1],ann.quadPoints[i+3],ann.quadPoints[i+5],ann.quadPoints[i+7]];
          rects.push([Math.min(...xs)-2, Math.min(...ys)-2, Math.max(...xs)+2, Math.max(...ys)+2]);
        }
      } else if (ann.rect) {
        const r = ann.rect;
        rects.push([Math.min(r[0],r[2])-2, Math.min(r[1],r[3])-2, Math.max(r[0],r[2])+2, Math.max(r[1],r[3])+2]);
      }
    }
    return rects;
  }
  function itemOverlaps(item, rects) {
    if (!rects.length) return false;
    const [,,,, ix, iy] = item.transform;
    const iw = item.width || 0, ih = Math.abs(item.height) || 10;
    for (const [x1,y1,x2,y2] of rects) {
      if (ix < x2 && ix + iw > x1 && iy < y2 && iy + ih > y1) return true;
    }
    return false;
  }
  const best = {};
  for (let p = 1; p <= pdfDoc.numPages; p++) {
    const page     = await pdfDoc.getPage(p);
    const content  = await page.getTextContent();
    const secLabel = sectionOf(p);
    const hlRects  = await getHighlightRects(page);
    for (const item of content.items.filter(i => i.str && i.str.trim())) {
      const highlighted = itemOverlaps(item, hlRects);
      const lower = item.str.toLowerCase();
      for (const word of words) {
        const seenKey = word + '|' + (secLabel || '_');
        if (best[seenKey] && best[seenKey].highlighted) continue;
        let idx = 0;
        while (true) {
          const pos = lower.indexOf(word, idx);
          if (pos === -1) break;
          idx = pos + 1;
          const before = pos > 0 ? lower[pos-1] : ' ';
          const after  = pos + word.length < lower.length ? lower[pos+word.length] : ' ';
          if (/[a-záàâäéèêëíìîïóòôöúùûü']/i.test(before) || /[a-záàâäéèêëíìîïóòôöúùûü']/i.test(after)) continue;
          const [,,,, x, y] = item.transform;
          const cw = item.width / (item.str.length || 1);
          const candidate = { word, meaning: dict[word], page: p, section: secLabel, highlighted, rect: { x: x + pos*cw, y, w: word.length*cw, h: Math.abs(item.height) || 12 } };
          if (!best[seenKey] || (!best[seenKey].highlighted && highlighted)) best[seenKey] = candidate;
          break;
        }
      }
    }
  }
  return Object.values(best);
}

// ── Sidebar ──────────────────────────────────────────────────
function buildSidebar(sections) {
  const sidebar = $('textSidebar'), list = $('textBtnList');
  list.innerHTML = '';
  if (!sections.length) { sidebar.style.display = 'none'; return; }
  sidebar.style.display = 'block';
  const allBtn = document.createElement('button');
  allBtn.className = 'text-btn text-btn-all active';
  allBtn.textContent = 'Alle teksten'; allBtn.dataset.label = '';
  allBtn.addEventListener('click', () => selectText('', allBtn));
  list.appendChild(allBtn);
  for (const s of sections) {
    const btn = document.createElement('button');
    btn.className = 'text-btn'; btn.textContent = s.label; btn.dataset.label = s.label;
    btn.addEventListener('click', () => selectText(s.label, btn));
    list.appendChild(btn);
  }
}
function selectText(label, clickedBtn) {
  activeFilter = label || null;
  $('textBtnList').querySelectorAll('.text-btn').forEach(b => b.classList.remove('active'));
  clickedBtn.classList.add('active');
  startSession();
}

// ── Start ────────────────────────────────────────────────────
$('startBtn').addEventListener('click', async () => {
  if (!pdfDoc) return;
  const dict = parseDict($('dictInput').value);
  if (!Object.keys(dict).length) { alert('Vul de woordenlijst in.'); return; }
  $('startBtn').disabled = true;
  $('loadingMsg').style.display = 'block';
  $('noWordsMsg').style.display = 'none';
  detectedTexts = await detectTextSections();
  allEntries    = await findWords(dict, detectedTexts);
  $('loadingMsg').style.display = 'none';
  $('startBtn').disabled = false;
  if (!allEntries.length) { $('noWordsMsg').style.display = 'block'; return; }
  buildSidebar(detectedTexts);
  activeFilter = null;
  $('setupSection').style.display = 'none';
  $('learnSection').style.display = 'block';
  startSession();
});

function startSession(entriesToUse) {
  wordEntries = entriesToUse ? entriesToUse : (activeFilter ? allEntries.filter(e => e.section === activeFilter) : allEntries);
  if (!wordEntries.length) { alert('Geen woorden gevonden voor deze tekst.'); return; }
  queue = shuffle([...Array(wordEntries.length).keys()]);
  qi = 0; correctCnt = 0; wrongCnt = 0; missed = [];
  $('resultSection').style.display = 'none';
  $('learnSection').style.display  = 'block';
  $('statTotal').textContent = wordEntries.length;
  showWord();
}

// ── Render page ──────────────────────────────────────────────
async function renderPage(pageNum) {
  const page   = await pdfDoc.getPage(pageNum);
  const canvas = $('pdfCanvas');
  const viewer = $('pdfViewer');
  const dpr    = Math.min(window.devicePixelRatio || 1, 3);
  const vp0    = page.getViewport({ scale: 1 });

  const cssW = viewer.clientWidth;
  const cssH = viewer.clientHeight;

  // Fit page inside viewer (A4 box), letterbox if needed
  const scale = Math.min(cssW / vp0.width, cssH / vp0.height);

  // Render at device pixel ratio for sharpness
  const vpHi = page.getViewport({ scale: scale * dpr });
  canvas.width  = vpHi.width;
  canvas.height = vpHi.height;

  // CSS size = physical pixels / dpr
  const cssCW = vpHi.width  / dpr;
  const cssCH = vpHi.height / dpr;
  canvas.style.width  = cssCW + 'px';
  canvas.style.height = cssCH + 'px';

  // Centre canvas inside viewer (letterbox)
  canvas.style.left = Math.round((cssW - cssCW) / 2) + 'px';
  canvas.style.top  = Math.round((cssH - cssCH) / 2) + 'px';

  await page.render({ canvasContext: canvas.getContext('2d'), viewport: vpHi }).promise;

  // Store CSS-scale viewport for highlight positioning
  currentVP = page.getViewport({ scale });
  $('pageInfo').textContent = `p. ${pageNum} / ${pdfDoc.numPages}`;
  return currentVP;
}

// ── Highlight & zoom ─────────────────────────────────────────
function positionHighlight(rect, vp) {
  const canvas  = $('pdfCanvas');
  const hl      = $('highlight');

  // CSS size of canvas (physical px / dpr)
  const cssCW = parseFloat(canvas.style.width)  || canvas.offsetWidth;
  const cssCH = parseFloat(canvas.style.height) || canvas.offsetHeight;

  // Offset of canvas inside viewer (letterbox margins)
  const offX = parseFloat(canvas.style.left) || 0;
  const offY = parseFloat(canvas.style.top)  || 0;

  // Convert PDF user-space → CSS pixels (vp is at CSS scale, not dpr scale)
  const [cx1, cy1] = vp.convertToViewportPoint(rect.x, rect.y);
  const [cx2, cy2] = vp.convertToViewportPoint(rect.x + rect.w, rect.y + rect.h);

  // Word box in CSS pixels relative to canvas
  const wx = Math.min(cx1, cx2);
  const wy = Math.min(cy1, cy2);
  const ww = Math.abs(cx2 - cx1);
  const wh = Math.abs(cy2 - cy1);

  // Highlight position = canvas offset + word position inside canvas
  const padX = Math.max(60, ww * 0.8);
  const padY = Math.max(28, wh * 0.7);
  hl.style.left   = (offX + wx - padX) + 'px';
  hl.style.top    = (offY + wy - padY) + 'px';
  hl.style.width  = (ww + padX * 2) + 'px';
  hl.style.height = (wh + padY * 2) + 'px';

  // Zoom: scale canvas so word fills ~18% of canvas width, capped 1.2–2.8×
  const zoom = Math.min(Math.max((cssCW * 0.18) / (ww || 1), 1.2), 2.8);

  // Transform-origin at word centre, in % relative to canvas CSS size
  // but canvas is positioned with left/top, so origin is within the canvas element
  const ox = (wx + ww / 2) / cssCW * 100;
  const oy = (wy + wh / 2) / cssCH * 100;
  canvas.style.transformOrigin = `${ox}% ${oy}%`;
  canvas.style.transform = `scale(${zoom})`;
}

// ── Update progress bar ──────────────────────────────────────
function updateProgress() {
  const total = wordEntries.length;
  const done  = correctCnt + wrongCnt;
  $('progressFill').style.height = (done / total * 100) + '%';
  $('statCorrect').textContent = correctCnt;
  $('statWrong').textContent   = wrongCnt;
}

// ── Show word ────────────────────────────────────────────────
async function showWord() {
  answered = false; lastWasWrong = false;
  const fb = $('feedback');
  fb.className = '';
  $('feedbackText').textContent = '';
  fb.querySelector('.fb-icon').textContent = '';
  $('nextBtn').style.display     = 'none';
  $('tochGoedBtn').style.display = 'none';
  $('answerInput').value    = '';
  $('answerInput').disabled = false;
  $('checkBtn').disabled    = false;
  $('highlight').classList.remove('show');
  $('pdfCanvas').style.transform = 'scale(1)';
  const entry = wordEntries[queue[qi]];
  $('wordPrompt').textContent   = entry.word;
  $('statCurrent').textContent  = qi + 1;
  updateProgress();
  const vp = await renderPage(entry.page);
  setTimeout(() => { positionHighlight(entry.rect, vp); $('highlight').classList.add('show'); }, 120);
  $('answerInput').focus();
}

// ── Green flash ──────────────────────────────────────────────
function flashGreen() {
  const el = $('correctFlash');
  el.classList.remove('flash-in', 'flash-out');
  el.offsetHeight; // force reflow
  el.classList.add('flash-in');
  setTimeout(() => { el.classList.remove('flash-in'); el.classList.add('flash-out'); }, 120);
  setTimeout(() => { el.classList.remove('flash-out'); }, 620);
}

// ── Check answer ─────────────────────────────────────────────
function normalize(s) { return s.toLowerCase().trim().replace(/[.,!?;'"«»]/g,''); }

function checkAnswer() {
  if (answered) { advance(); return; }
  const entry = wordEntries[queue[qi]];
  const user  = normalize($('answerInput').value);
  const fb    = $('feedback');

  if (!user) {
    answered = true; lastWasWrong = true;
    wrongCnt++; missed.push(entry);
    $('answerInput').disabled = true; $('checkBtn').disabled = true;
    fb.className = 'show wrong';
    fb.querySelector('.fb-icon').textContent = '✕';
    $('feedbackText').textContent = `Juist antwoord: "${entry.meaning}"`;
    $('tochGoedBtn').style.display = 'inline-block';
    $('nextBtn').style.display = 'inline-block';
    updateProgress();
    return;
  }

  const ok = entry.meaning.split(/[,\/]/).map(normalize).some(a => user === a || a.includes(user) || user.includes(a));
  answered = true; lastWasWrong = !ok;
  $('answerInput').disabled = true; $('checkBtn').disabled = true;

  if (ok) {
    correctCnt++;
    fb.className = 'show correct';
    fb.querySelector('.fb-icon').textContent = '✓';
    $('feedbackText').textContent = `Correct! "${entry.meaning}"`;
    $('tochGoedBtn').style.display = 'none';
    flashGreen();
  } else {
    wrongCnt++; missed.push(entry);
    fb.className = 'show wrong';
    fb.querySelector('.fb-icon').textContent = '✕';
    $('feedbackText').textContent = `Juist antwoord: "${entry.meaning}"`;
    $('tochGoedBtn').style.display = 'inline-block';
  }
  updateProgress();
  $('nextBtn').style.display = 'inline-block';
}

$('checkBtn').addEventListener('click', checkAnswer);

// ── Keyboard ─────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if ($('learnSection').style.display === 'none') return;
  if (e.key === 'Shift') {
    if ($('tochGoedBtn').style.display !== 'none') { e.preventDefault(); tochGoed(); }
    return;
  }
  if (e.key !== 'Enter') return;
  if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
  if (!answered) checkAnswer(); else advance();
});

// ── Toch goed ────────────────────────────────────────────────
function tochGoed() {
  if (!answered || !lastWasWrong) return;
  wrongCnt--; correctCnt++;
  const entry = wordEntries[queue[qi]];
  missed = missed.filter(e => e !== entry);
  lastWasWrong = false;
  updateProgress();
  flashGreen();
  advance();
}
$('tochGoedBtn').addEventListener('click', tochGoed);

// ── Advance ──────────────────────────────────────────────────
async function advance() {
  qi++;
  if (qi >= wordEntries.length) { showResult(); return; }
  await showWord();
}

$('nextBtn').addEventListener('click', () => advance());
$('skipBtn').addEventListener('click', async () => {
  if (!answered) { missed.push(wordEntries[queue[qi]]); wrongCnt++; updateProgress(); }
  await advance();
});
$('resetBtn').addEventListener('click', () => {
  $('highlight').classList.remove('show');
  $('pdfCanvas').style.transform = 'scale(1)';
  $('learnSection').style.display  = 'none';
  $('resultSection').style.display = 'none';
  $('setupSection').style.display  = 'flex';
});

// ── Result ───────────────────────────────────────────────────
function showResult() {
  $('highlight').classList.remove('show');
  $('pdfCanvas').style.transform = 'scale(1)';
  $('learnSection').style.display  = 'none';
  $('resultSection').style.display = 'block';
  const pct = Math.round(correctCnt / wordEntries.length * 100);
  $('resultScore').textContent = `${correctCnt} / ${wordEntries.length}`;
  $('resultMsg').textContent   = pct >= 80 ? 'Uitstekend!' : pct >= 50 ? 'Goed bezig!' : 'Blijf oefenen!';
  $('missedList').innerHTML = missed.length
    ? '<h3>Nog te oefenen</h3><ul>' + missed.map(e => `<li><em>${e.word}</em> = ${e.meaning}</li>`).join('') + '</ul>'
    : '<p style="color:var(--green);margin-top:12px;font-weight:700">Alle woorden goed!</p>';
  $('retryMissedBtn').style.display = missed.length ? 'inline-block' : 'none';
}

$('retryMissedBtn').addEventListener('click', () => {
  const toRetry = [...missed];
  $('resultSection').style.display = 'none';
  startSession(toRetry);
});
$('playAgainBtn').addEventListener('click', () => {
  $('resultSection').style.display = 'none';
  startSession();
});

// ── Fullscreen ───────────────────────────────────────────────
const fsBtn = $('fullscreenBtn');
fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen().catch(()=>{});
});
document.addEventListener('fullscreenchange', () => {
  const isFs = !!document.fullscreenElement;
  $('fsIconEnter').style.display = isFs ? 'none' : 'block';
  $('fsIconExit').style.display  = isFs ? 'block' : 'none';
});

function shuffle(arr) {
  for (let i = arr.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

// ── Init ─────────────────────────────────────────────────────
openDB().then(() => renderSavedList()).catch(e => { console.warn('IndexedDB niet beschikbaar:', e); renderSavedList(); });
</script>
</body>
</html>
